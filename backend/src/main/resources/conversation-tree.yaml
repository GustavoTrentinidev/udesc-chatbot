  # ─── MENU 7: SOE ─────────────────────────────────────────────────────────────

  - id: leaf-soe
    backNodeId: menu-main
    message:
      en: "🧭 SOE — Student Orientation Service\n\nThe SOE provides support services specifically designed for students, including foreign exchange students.\n\n🛠️ Services offered:\n• Psychological support and counseling\n• Academic guidance and study strategies\n• Social integration support for foreign students\n• Assistance with university bureaucracy\n• Financial aid information\n\n⏰ Office hours: Mon–Fri, 8:00–12:00 and 13:30–17:30\n📍 Location: CCT — Administrative Block, room 105\n📞 Phone: (47) 3481-7600 ext. 7620\n📧 Email: soe.cct@udesc.br\n🌐 Website: https://www.udesc.br/cct/soe"
      pt: "🧭 SOE — Serviço de Orientação ao Estudante\n\nO SOE oferece serviços de apoio especialmente para estudantes, incluindo estudantes estrangeiros de intercâmbio.\n\n🛠️ Serviços oferecidos:\n• Apoio psicológico e aconselhamento\n• Orientação acadêmica e estratégias de estudo\n• Suporte à integração social de estudantes estrangeiros\n• Auxílio com burocracia universitária\n• Informações sobre auxílios financeiros\n\n⏰ Horário de atendimento: Seg–Sex, 8:00–12:00 e 13:30–17:30\n📍 Localização: CCT — Bloco Administrativo, sala 105\n📞 Telefone: (47) 3481-7600 ramal 7620\n📧 E-mail: soe.cct@udesc.br\n🌐 Site: https://www.udesc.br/cct/soe"
      es: "🧭 SOE — Servicio de Orientación al Estudiante\n\nEl SOE ofrece servicios de apoyo especialmente diseñados para estudiantes, incluidos los de intercambio.\n\n🛠️ Servicios ofrecidos:\n• Apoyo psicológico y orientación\n• Guía académica y estrategias de estudio\n• Apoyo a la integración social de estudiantes extranjeros\n• Asistencia con trámites universitarios\n• Información sobre ayudas financieras\n\n⏰ Horario de atención: Lun–Vie, 8:00–12:00 y 13:30–17:30\n📍 Ubicación: CCT — Bloque Administrativo, sala 105\n📞 Teléfono: (47) 3481-7600 ext. 7620\n📧 Correo: soe.cct@udesc.br\n🌐 Sitio web: https://www.udesc.br/cct/soe"
    options:
      - label: { en: "⬅️ Back to Main Menu", pt: "⬅️ Voltar ao Menu Principal", es: "⬅️ Volver al Menú Principal" }
        nextNodeId: menu-main

  # ─── MENU 8: Student Housing ──────────────────────────────────────────────────

  - id: leaf-housing
    backNodeId: menu-main
    message:
      en: "🏠 Student Housing — CCT Joinville\n\nUDESC CCT does not have an on-campus student dormitory.\n\n🏘️ Alternatives for foreign students:\n• The university has partnerships with local boarding houses near campus\n• Contact the tutoring team for a list of recommended housing options\n• Facebook group: 'Moradia UDESC CCT' for shared housing listings\n• The city of Joinville offers social housing programs for low-income students — contact SOE for details\n\n💡 Tip: Look for housing near the 'Zona Industrial Norte' district for easy access to CCT.\n\n📧 For housing assistance: tutoria.cct@udesc.br"
      pt: "🏠 Residência Estudantil — CCT Joinville\n\nO CCT da UDESC não possui alojamento estudantil no campus.\n\n🏘️ Alternativas para estudantes estrangeiros:\n• A universidade tem parcerias com repúblicas locais próximas ao campus\n• Entre em contato com a equipe de tutoria para uma lista de opções de moradia recomendadas\n• Grupo do Facebook: 'Moradia UDESC CCT' para anúncios de casas compartilhadas\n• A cidade de Joinville oferece programas de moradia social para estudantes de baixa renda — contate o SOE para detalhes\n\n💡 Dica: Procure moradia perto do bairro 'Zona Industrial Norte' para facilitar o acesso ao CCT.\n\n📧 Para assistência com moradia: tutoria.cct@udesc.br"
      es: "🏠 Residencia Estudiantil — CCT Joinville\n\nEl CCT de UDESC no tiene dormitorio estudiantil en el campus.\n\n🏘️ Alternativas para estudiantes extranjeros:\n• La universidad tiene convenios con pensiones locales cerca del campus\n• Contacta al equipo de tutoría para una lista de opciones de alojamiento recomendadas\n• Grupo de Facebook: 'Moradia UDESC CCT' para anuncios de vivienda compartida\n• La ciudad de Joinville ofrece programas de vivienda social para estudiantes de bajos recursos — contacta al SOE para detalles\n\n💡 Consejo: Busca alojamiento cerca del barrio 'Zona Industrial Norte' para un fácil acceso al CCT.\n\n📧 Para asistencia con alojamiento: tutoria.cct@udesc.br"
    options:
      - label: { en: "⬅️ Back to Main Menu", pt: "⬅️ Voltar ao Menu Principal", es: "⬅️ Volver al Menú Principal" }
        nextNodeId: menu-main

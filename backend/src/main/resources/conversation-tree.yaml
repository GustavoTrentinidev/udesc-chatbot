  # ─── MENU 6: Tutoring Team ────────────────────────────────────────────────────

  - id: leaf-tutoring
    backNodeId: menu-main
    message:
      en: "🤝 CCT Academic Tutoring Team\n\nThe tutoring team helps foreign and exchange students with academic and administrative questions.\n\n📧 Email: tutoria.cct@udesc.br\n🌐 Website: https://www.udesc.br/cct/tutoriaacademica\n👥 Team: https://www.udesc.br/cct/tutoriaacademica/equipe\n📞 Phone: (47) 3481-7600 (ask for Tutoria)\n\n👩‍🏫 Course Supervisors:\n• TADS: Prof. Débora Cabral Nazário\n• Computer Science: Prof. Luciana Rita Guedes\n\n⏰ Office hours: Check the website for current schedule"
      pt: "🤝 Equipe de Tutoria Acadêmica do CCT\n\nA equipe de tutoria ajuda estudantes estrangeiros e de intercâmbio com dúvidas acadêmicas e administrativas.\n\n📧 E-mail: tutoria.cct@udesc.br\n🌐 Site: https://www.udesc.br/cct/tutoriaacademica\n👥 Equipe: https://www.udesc.br/cct/tutoriaacademica/equipe\n📞 Telefone: (47) 3481-7600 (pedir pela Tutoria)\n\n👩‍🏫 Supervisoras de Curso:\n• TADS: Profa. Débora Cabral Nazário\n• Ciência da Computação: Profa. Luciana Rita Guedes\n\n⏰ Horário de atendimento: Consulte o site para o horário atual"
      es: "🤝 Equipo de Tutoría Académica del CCT\n\nEl equipo de tutoría ayuda a los estudiantes extranjeros e de intercambio con dudas académicas y administrativas.\n\n📧 Correo: tutoria.cct@udesc.br\n🌐 Sitio web: https://www.udesc.br/cct/tutoriaacademica\n👥 Equipo: https://www.udesc.br/cct/tutoriaacademica/equipe\n📞 Teléfono: (47) 3481-7600 (pedir por Tutoría)\n\n👩‍🏫 Supervisoras de Curso:\n• TADS: Prof. Débora Cabral Nazário\n• Ciencias de la Computación: Prof. Luciana Rita Guedes\n\n⏰ Horario de atención: Consulta el sitio web para el horario actual"

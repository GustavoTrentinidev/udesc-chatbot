    backNodeId: menu-main
    message:
      en: "📋 CPF — Individual Taxpayer Registry (Brazil)\n\n🌐 Online Registration:\n1️⃣ Go to: https://servicos.receita.fazenda.gov.br/Servicos/CPF/InscricaoCpfEstrangeiro/\n2️⃣ Fill in your personal data\n3️⃣ Submit the form online\n\n⚠️ IMPORTANT for foreigners:\nAfter online registration, you MUST appear IN PERSON at the Receita Federal to validate your CPF.\n\n📍 Nearest Receita Federal (CCT — Joinville):\nAv. Getúlio Vargas, 300 – Centro, Joinville – SC\n📞 Call center: 146\n\n💡 Bring: Passport or official ID + proof of address"
      pt: "📋 CPF — Cadastro de Pessoas Físicas (Brasil)\n\n🌐 Cadastro Online:\n1️⃣ Acesse: https://servicos.receita.fazenda.gov.br/Servicos/CPF/InscricaoCpfEstrangeiro/\n2️⃣ Preencha seus dados pessoais\n3️⃣ Envie o formulário online\n\n⚠️ IMPORTANTE para estrangeiros:\nApós o cadastro online, você DEVE comparecer PRESENCIALMENTE à Receita Federal para validar o CPF.\n\n📍 Receita Federal mais próxima (CCT — Joinville):\nAv. Getúlio Vargas, 300 – Centro, Joinville – SC\n📞 Central de atendimento: 146\n\n💡 Leve: Passaporte ou documento oficial + comprovante de residência"
      es: "📋 CPF — Registro de Contribuyentes Individuales (Brasil)\n\n🌐 Registro en Línea:\n1️⃣ Accede a: https://servicos.receita.fazenda.gov.br/Servicos/CPF/InscricaoCpfEstrangeiro/\n2️⃣ Completa tus datos personales\n3️⃣ Envía el formulario online\n\n⚠️ IMPORTANTE para extranjeros:\nDespués del registro online, DEBES comparecer PRESENCIALMENTE en la Receita Federal para validar tu CPF.\n\n📍 Receita Federal más cercana (CCT — Joinville):\nAv. Getúlio Vargas, 300 – Centro, Joinville – SC\n📞 Central de atención: 146\n\n💡 Lleva: Pasaporte o documento oficial + comprobante de domicilio"

  - id: leaf-desc-siga
    backNodeId: menu-systems-desc
    message:
      en: "🎓 SIGA — Academic Management System\n📊 What it's for:\n• View your grades for all disciplines\n• Check your absences and attendance records\n• See your academic history\n• Access your class schedule\n• Download your enrollment certificate\n🔗 https://siga.udesc.br"
      pt: "🎓 SIGA — Sistema Integrado de Gestão Acadêmica\n📊 Para que serve:\n• Visualizar suas notas em todas as disciplinas\n• Verificar suas faltas e registro de presença\n• Consultar seu histórico acadêmico\n• Acessar seu horário de aulas\n• Baixar seu comprovante de matrícula\n🔗 https://siga.udesc.br"
      es: "🎓 SIGA — Sistema Integrado de Gestión Académica\n📊 Para qué sirve:\n• Ver tus calificaciones en todas las materias\n• Revisar tus faltas y registro de asistencia\n• Consultar tu historial académico\n• Ver tu horario de clases\n• Descargar tu comprobante de matrícula\n🔗 https://siga.udesc.br"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc

  - id: leaf-desc-moodle
    backNodeId: menu-systems-desc
    message:
      en: "📚 Moodle — Virtual Learning Environment\n📖 What it's for:\n• Access course materials (slides, readings, videos)\n• Submit assignments and exercises\n• Take online quizzes and exams\n• Communicate with professors and classmates via forums\n• Track deadlines for all your disciplines\n🔗 https://moodle.udesc.br"
      pt: "📚 Moodle — Ambiente Virtual de Aprendizagem\n📖 Para que serve:\n• Acessar materiais das disciplinas (slides, leituras, vídeos)\n• Entregar trabalhos e exercícios\n• Fazer questionários e provas online\n• Comunicar-se com professores e colegas via fóruns\n• Acompanhar prazos de todas as disciplinas\n🔗 https://moodle.udesc.br"
      es: "📚 Moodle — Entorno Virtual de Aprendizaje\n📖 Para qué sirve:\n• Acceder a materiales de las materias (diapositivas, lecturas, videos)\n• Entregar trabajos y ejercicios\n• Hacer cuestionarios y exámenes online\n• Comunicarte con profesores y compañeros mediante foros\n• Seguir los plazos de todas tus materias\n🔗 https://moodle.udesc.br"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc

  - id: leaf-desc-site
    backNodeId: menu-systems-desc
    message:
      en: "🌐 UDESC Website\n📋 What you'll find:\n• Course curriculum (PPC — Projeto Pedagógico do Curso)\n• Professor directory and office hours\n• Department news and events\n• Internship and research opportunities\n• Links to all UDESC campuses\n🔗 https://www.udesc.br/cct"
      pt: "🌐 Site UDESC\n📋 O que você encontrará:\n• Currículo do curso (PPC — Projeto Pedagógico do Curso)\n• Diretório de professores e horários de atendimento\n• Notícias e eventos do departamento\n• Oportunidades de estágio e pesquisa\n• Links para todos os campi da UDESC\n🔗 https://www.udesc.br/cct"
      es: "🌐 Sitio Web de UDESC\n📋 Lo que encontrarás:\n• Plan de estudios (PPC — Projeto Pedagógico do Curso)\n• Directorio de profesores y horarios de atención\n• Noticias y eventos del departamento\n• Oportunidades de prácticas e investigación\n• Enlace a todos los campus de UDESC\n🔗 https://www.udesc.br/cct"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc

  - id: leaf-desc-sas
    backNodeId: menu-systems-desc
    message:
      en: "🏫 SAS — Room Scheduling System\n🗓️ What it's for:\n• Book classrooms, labs, and meeting rooms\n• Check room availability by date and time\n• View existing room bookings\n• Cancel or modify your reservations\n🔗 Access via UDESC intranet (requires UDESC ID)"
      pt: "🏫 SAS — Sistema de Agendamento de Salas\n🗓️ Para que serve:\n• Reservar salas de aula, laboratórios e salas de reunião\n• Verificar disponibilidade de salas por data e horário\n• Visualizar reservas de salas existentes\n• Cancelar ou modificar suas reservas\n🔗 Acesso pela intranet da UDESC (requer ID UDESC)"
      es: "🏫 SAS — Sistema de Reserva de Salas\n🗓️ Para qué sirve:\n• Reservar aulas, laboratorios y salas de reuniones\n• Verificar disponibilidad de salas por fecha y hora\n• Ver reservas de salas existentes\n• Cancelar o modificar tus reservas\n🔗 Acceso por la intranet de UDESC (requiere ID UDESC)"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc

  - id: leaf-desc-office
    backNodeId: menu-systems-desc
    message:
      en: "📧 Office 365 — Microsoft Suite\n💼 What's included:\n• Institutional email: nome.sobrenome@edu.udesc.br\n• Microsoft Word, Excel, PowerPoint (online and desktop)\n• Microsoft Teams for video calls and collaboration\n• OneDrive for cloud storage (1TB)\n• Access: https://office.com — sign in with your UDESC ID"
      pt: "📧 Office 365 — Suite Microsoft\n💼 O que inclui:\n• E-mail institucional: nome.sobrenome@edu.udesc.br\n• Microsoft Word, Excel, PowerPoint (online e desktop)\n• Microsoft Teams para videochamadas e colaboração\n• OneDrive para armazenamento em nuvem (1TB)\n• Acesso: https://office.com — entre com seu ID UDESC"
      es: "📧 Office 365 — Suite de Microsoft\n💼 Qué incluye:\n• Correo institucional: nombre.apellido@edu.udesc.br\n• Microsoft Word, Excel, PowerPoint (online y escritorio)\n• Microsoft Teams para videollamadas y colaboración\n• OneDrive para almacenamiento en la nube (1TB)\n• Acceso: https://office.com — inicia sesión con tu ID UDESC"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc

  - id: leaf-desc-library
    backNodeId: menu-systems-desc
    message:
      en: "📖 UDESC Online Library\n🔍 What you can do:\n• Search books, journals, and academic articles\n• Access TCC (undergraduate thesis) repository\n• Download dissertations and doctoral theses\n• Access CAPES Periodicals Portal (free for UDESC students)\n• Use Pergamum catalog for physical library books\n🔗 https://www.udesc.br/bibliotecas\n🔗 CAPES: https://www.periodicos.capes.gov.br"
      pt: "📖 Biblioteca Online da UDESC\n🔍 O que você pode fazer:\n• Pesquisar livros, periódicos e artigos acadêmicos\n• Acessar o repositório de TCCs\n• Baixar dissertações e teses de doutorado\n• Acessar o Portal de Periódicos da CAPES (gratuito para alunos UDESC)\n• Usar o catálogo Pergamum para livros da biblioteca física\n🔗 https://www.udesc.br/bibliotecas\n🔗 CAPES: https://www.periodicos.capes.gov.br"
      es: "📖 Biblioteca en Línea de UDESC\n🔍 Lo que puedes hacer:\n• Buscar libros, revistas y artículos académicos\n• Acceder al repositorio de TCC (trabajos de grado)\n• Descargar disertaciones y tesis doctorales\n• Acceder al Portal de Periódicos de CAPES (gratuito para estudiantes de UDESC)\n• Usar el catálogo Pergamum para libros de la biblioteca física\n🔗 https://www.udesc.br/bibliotecas\n🔗 CAPES: https://www.periodicos.capes.gov.br"
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-desc


  - id: leaf-access-siga
    backNodeId: menu-systems-access
    message:
      en: "💻 SIGA — Academic Management System\n🔗 Access: https://siga.udesc.br\n📋 Requirements:\n• You need your UDESC ID (institutional login)\n• Your ID is in the format: first.last@udesc.br\n• First access: use the temporary password sent to your institutional email\n• If you don't have your UDESC ID yet, see menu option 3."
      pt: "💻 SIGA — Sistema Integrado de Gestão Acadêmica\n🔗 Acesso: https://siga.udesc.br\n📋 Requisitos:\n• Você precisa do seu ID UDESC (login institucional)\n• Seu ID está no formato: nome.sobrenome@udesc.br\n• Primeiro acesso: use a senha temporária enviada ao seu e-mail institucional\n• Se ainda não tem o ID UDESC, consulte a opção 3 do menu."
      es: "💻 SIGA — Sistema Integrado de Gestión Académica\n🔗 Acceso: https://siga.udesc.br\n📋 Requisitos:\n• Necesitas tu ID UDESC (inicio de sesión institucional)\n• Tu ID tiene el formato: nombre.apellido@udesc.br\n• Primer acceso: usa la contraseña temporal enviada a tu correo institucional\n• Si aún no tienes el ID UDESC, consulta la opción 3 del menú."
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-access

  - id: leaf-access-moodle
    backNodeId: menu-systems-access
    message:
      en: "💻 Moodle — Distance Learning Platform\n🔗 Access: https://moodle.udesc.br\n📋 Requirements:\n• Login with your UDESC ID (same as SIGA)\n• Your professors will enroll you in courses\n• Check your institutional email for Moodle notifications\n• If you don't have your UDESC ID yet, see menu option 3."
      pt: "💻 Moodle — Ambiente Virtual de Aprendizagem\n🔗 Acesso: https://moodle.udesc.br\n📋 Requisitos:\n• Login com o ID UDESC (mesmo do SIGA)\n• Os professores farão sua inscrição nas disciplinas\n• Verifique seu e-mail institucional para notificações do Moodle\n• Se ainda não tem o ID UDESC, consulte a opção 3 do menu."
      es: "💻 Moodle — Plataforma de Aprendizaje Virtual\n🔗 Acceso: https://moodle.udesc.br\n📋 Requisitos:\n• Inicia sesión con tu ID UDESC (igual que en SIGA)\n• Los profesores te inscribirán en las asignaturas\n• Revisa tu correo institucional para notificaciones de Moodle\n• Si aún no tienes el ID UDESC, consulta la opción 3 del menú."
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-access

  - id: leaf-access-sigaa
    backNodeId: menu-systems-access
    message:
      en: "💻 SIGAA — Academic System (Postgraduate)\n🔗 Access: https://sigaa.udesc.br\n📋 Requirements:\n• Login with your UDESC ID (institutional login)\n• Used mainly for postgraduate programs\n• Contact your program coordinator if you have access issues\n• If you don't have your UDESC ID yet, see menu option 3."
      pt: "💻 SIGAA — Sistema de Informações para o Ensino (Pós-graduação)\n🔗 Acesso: https://sigaa.udesc.br\n📋 Requisitos:\n• Login com o ID UDESC (login institucional)\n• Utilizado principalmente para programas de pós-graduação\n• Entre em contato com o coordenador do programa se tiver problemas de acesso\n• Se ainda não tem o ID UDESC, consulte a opção 3 do menu."
      es: "💻 SIGAA — Sistema de Información Académica (Posgrado)\n🔗 Acceso: https://sigaa.udesc.br\n📋 Requisitos:\n• Inicia sesión con tu ID UDESC (inicio de sesión institucional)\n• Utilizado principalmente para programas de posgrado\n• Contacta al coordinador de tu programa si tienes problemas de acceso\n• Si aún no tienes el ID UDESC, consulta la opción 3 del menú."
    options:
      - label: { en: "⬅️ Back", pt: "⬅️ Voltar", es: "⬅️ Volver" }
        nextNodeId: menu-systems-access

  # ─── MENU 3: UDESC ID ─────────────────────────────────────────────────────────

  - id: leaf-udesc-id
    backNodeId: menu-main
    message:
      en: "🪪 How to Get Your UDESC Institutional ID\n\n1️⃣ After enrollment, go to the IT support at your campus (CCT: Bloco A, room 002)\n2️⃣ Bring your student registration number (RA) and a photo ID\n3️⃣ IT staff will create your account: nome.sobrenome@udesc.br\n4️⃣ A temporary password will be sent to your personal email\n5️⃣ Log in at https://id.udesc.br and change your password\n6️⃣ Use this ID to access SIGA, Moodle, Office 365, and other UDESC systems\n\n⚠️ If you have issues, contact: suporte.cct@udesc.br | (47) 3481-7600"
      pt: "🪪 Como Obter o ID Institucional UDESC\n\n1️⃣ Após a matrícula, vá ao suporte de TI do seu campus (CCT: Bloco A, sala 002)\n2️⃣ Leve o seu número de matrícula (RA) e um documento de identidade com foto\n3️⃣ A equipe de TI criará sua conta: nome.sobrenome@udesc.br\n4️⃣ Uma senha temporária será enviada ao seu e-mail pessoal\n5️⃣ Faça login em https://id.udesc.br e altere sua senha\n6️⃣ Use este ID para acessar SIGA, Moodle, Office 365 e outros sistemas UDESC\n\n⚠️ Em caso de problemas, contate: suporte.cct@udesc.br | (47) 3481-7600"
      es: "🪪 Cómo Obtener el ID Institucional de UDESC\n\n1️⃣ Después de la matrícula, ve al soporte de TI de tu campus (CCT: Bloque A, sala 002)\n2️⃣ Lleva tu número de matrícula (RA) y un documento de identidad con foto\n3️⃣ El equipo de TI creará tu cuenta: nombre.apellido@udesc.br\n4️⃣ Una contraseña temporal será enviada a tu correo personal\n5️⃣ Inicia sesión en https://id.udesc.br y cambia tu contraseña\n6️⃣ Usa este ID para acceder a SIGA, Moodle, Office 365 y otros sistemas de UDESC\n\n⚠️ Si tienes problemas, contacta: suporte.cct@udesc.br | (47) 3481-7600"
    options:
      - label: { en: "⬅️ Back to Main Menu", pt: "⬅️ Voltar ao Menu Principal", es: "⬅️ Volver al Menú Principal" }
        nextNodeId: menu-main

